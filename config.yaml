# IBVAP configuration. Anything omitted falls back to ibvap/config.py DEFAULTS.
# Coordinates are normalized (0-1) fractions of the frame: (0,0) = top-left.

model:
  backend: auto          # auto = YOLO if installed, else OpenCV motion demo | yolo | motion
  name: yolov8n.pt       # yolo11n.pt / yolov8s.pt = more accurate, slower
  conf: 0.35
  imgsz: 640             # 960 or 1280 helps small/distant people at the fence
  device: auto           # auto | cpu | cuda | mps
  pose_model: null       # "yolov8n-pose.pt" -> keypoint-based crawl/crouch detection

tripwires:
  - id: border_fence_alpha
    name: Border Fence - Sector 4
    p1: [0.1, 0.65]
    p2: [0.9, 0.65]
    direction: both      # both | in | out   ("in" = top -> bottom for a horizontal wire)
    classes: [person, bicycle, motorcycle, car, bus, truck]

zones:
  - id: restricted_bunker_zone
    name: Buffer Zone 14
    polygon: [[0.2, 0.7], [0.8, 0.7], [0.85, 0.95], [0.15, 0.95]]
    max_dwell_sec: 10
    alert_on_entry: false

behavior:
  pose_confirm_frames: 6
  bag_stationary_sec: 15
  crowd_min_people: 5

anpr:
  enabled: true
  ocr_backend: auto      # auto | easyocr | tesseract | none
  watchlist_file: data/plate_watchlist.json   # {"DL01AB1234": "reason", ...}

face:
  enabled: false         # enable after: python scripts/download_models.py + enrolling photos
  watchlist_dir: data/watchlist

alerts:
  db_path: data/ibvap.db
  snapshot_dir: data/snapshots
  report_dir: data/reports
  webhook_url: null
  telegram_bot_token: null
  telegram_chat_id: null
  notify_min_severity: HIGH

cameras:                 # add one entry per feed (file, webcam index, or rtsp:// URL)
  - id: CAM_01
    sector: Sector 4 (Fence Perimeter)
    source: samples/vtest.avi
  # - id: CAM_02
  #   sector: Sector 5 (Gate)
  #   source: rtsp://user:pass@192.168.1.20:554/stream1
  #   tripwires: [...]   # optional per-camera override

server:
  host: 127.0.0.1
  port: 8000
